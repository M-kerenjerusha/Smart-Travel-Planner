<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trips</title>
</head>
<body>
<h1>Trips</h1>
<form action="/trips/add" method="post">
    Destination: <input type="text" name="destination" required>
    Date: <input type="text" name="date" placeholder="YYYY-MM-DD" required>
    <button type="submit">Add Trip</button>
</form>
<ul>
    <li th:each="trip : ${trips}" th:text="${trip.destination} + ' on ' + ${trip.date}"></li>
</ul>
<a href="/users">Go to Users</a> | <a href="/bookings">Go to Bookings</a>
</body>
</html>
